services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pipm
      POSTGRES_PASSWORD: pipm
      POSTGRES_DB: pipm
    ports:
      - "5432:5432"
    volumes:
      - pipm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pipm -d pipm"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://pipm:pipm@db:5432/pipm
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pipm_pgdata:
